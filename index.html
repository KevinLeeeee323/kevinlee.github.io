<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="author" content="Zhicheng Li">
    <meta name="description" content="Personal homepage and contact information of Zhicheng Li (李智成), also known as Kevin Lee.">
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 48px 24px;
        background: #faf9f6;
        color: #242b30;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        align-items: center;
        gap: 48px;
        width: 100%;
        max-width: 720px;
        padding: 48px 0;
        border-top: 1px solid #dcded9;
        border-bottom: 1px solid #dcded9;
      }
      img {
        width: 200px;
        height: 200px;
        flex-shrink: 0;
        object-fit: cover;
        border-radius: 50%;
      }
      h1 { margin: 0; font-size: clamp(28px, 4vw, 36px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.3; }
      h1 span { display: block; margin-top: 8px; font-size: 24px; font-weight: 400; letter-spacing: 0.04em; }
      .english-name { margin: 20px 0 28px; color: #626b70; font-size: 20px; }
      main > div { min-width: 0; }
      .emails { margin: 0; padding: 0; list-style: none; color: #286459; font-size: 16px; line-height: 1.7; overflow-wrap: anywhere; }
      .emails li + li { margin-top: 8px; }
      @media (max-width: 600px) {
        main { flex-direction: column; gap: 32px; text-align: center; padding: 36px 0; }
        img { width: 168px; height: 168px; }

        <p class="english-name">Kevin Lee</p>
        <ul class="emails" aria-label="Email addresses (replace AT with @ and DOT with a period)">
          <li>23373285 AT buaa DOT edu DOT cn</li>
          <li>lizhicheng2005 AT icloud DOT com</li>
        </ul>
